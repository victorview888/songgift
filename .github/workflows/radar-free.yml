name: SongGift Free Radar
on:
  schedule:
    - cron: '30 1 * * *' # 09:30 Asia/Shanghai; GitHub schedules may be delayed.
  workflow_dispatch:

permissions: {}
concurrency:
  group: songgift-free-radar
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: zhuyansen/new-term-radar
          ref: fe67ff1acab728141644a4a9741295469b4feee6
          path: .radar-upstream
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .radar-state
          key: radar-free-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: radar-free-v1-
      - name: Collect public free sources only
        run: python scripts/radar/collect.py --upstream .radar-upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always()
        with:
          path: .radar-state
          key: radar-free-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-radar-report
          path: radar-report.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: public-radar-report
      - name: Upload with GitHub short-lived identity
        run: python3 scripts/radar/publish.py radar-report.json
